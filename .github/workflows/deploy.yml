name: Logi CD (Auto Deploy)

on:
  workflow_run:
    workflows: ["Logi CI"]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Create RDS snapshot (pre-deploy)
        run: |
          SNAPSHOT_ID="pre-deploy-$(date +%Y%m%d-%H%M%S)"
          echo "Creating snapshot: $SNAPSHOT_ID"

          aws rds create-db-snapshot \
            --db-instance-identifier ${{ secrets.RDS_INSTANCE_ID }} \
            --db-snapshot-identifier $SNAPSHOT_ID

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/frappe-bench
            ./scripts/deploy.sh
            
      - name: Cleanup old snapshots (keep last 3)
        run: |
          SNAPSHOTS=$(aws rds describe-db-snapshots \
            --db-instance-identifier ${{ secrets.RDS_INSTANCE_ID }} \
            --snapshot-type manual \
            --query 'DBSnapshots | sort_by(@, &SnapshotCreateTime) | [].DBSnapshotIdentifier' \
            --output text)
      
          COUNT=0
          for SNAP in $SNAPSHOTS; do
            COUNT=$((COUNT+1))
      
            if [ $COUNT -gt 3 ]; then
              STATUS=$(aws rds describe-db-snapshots \
                --db-snapshot-identifier "$SNAP" \
                --query 'DBSnapshots[0].Status' \
                --output text)
      
              if [[ "$STATUS" == "available" || "$STATUS" == "failed" ]]; then
                echo "Deleting old snapshot: $SNAP (status=$STATUS)"
                aws rds delete-db-snapshot --db-snapshot-identifier "$SNAP"
              else
                echo "Skipping snapshot: $SNAP (status=$STATUS)"
              fi
            fi
          done
      
