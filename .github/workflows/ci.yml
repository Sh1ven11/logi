name: Logi CI

on:
  push:
    branches: [ Main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: admin
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=2s --health-retries=3
      redis:
        image: redis
        ports:
          - 6379:6379

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y mariadb-client curl build-essential libmysqlclient-dev
          curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
          sudo apt install -y nodejs
          sudo npm install -g yarn

      - name: Install Frappe Bench
        run: pip install frappe-bench

      - name: Initialize Bench
        run: |
          # --skip-redis-config-generation ensures we use the Redis service container
          bench init --skip-redis-config-generation --frappe-branch version-15 test-bench
          cd test-bench
          
          # Get standard apps
          bench get-app erpnext --branch version-15
          bench get-app https://github.com/resilient-tech/india-compliance.git --branch version-15
          
          # Get your custom app
          bench get-app logi https://github.com/Sh1ven11/logi.git --branch Main

      - name: Create Site and Install Apps
        run: |
          cd test-bench
          
          # Create the site pointing to the MariaDB service
          bench new-site test.local \
            --db-host 127.0.0.1 \
            --admin-password admin \
            --mariadb-root-password admin
          
          # Enable Developer Mode (Fixes 'Not in Developer Mode' error)
          bench --site test.local set-config developer_mode 1
          
          # Install apps in order
          bench --site test.local install-app erpnext
          bench --site test.local install-app india_compliance
          bench --site test.local install-app logi

      - name: Run Tests
        run: |
          cd test-bench
          # This will look for test files in your logi app
          bench --site test.local run-tests --app logi
