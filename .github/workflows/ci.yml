name: Logi CI

on:
  push:
    branches: [ Main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis
        ports:
          - 6379:6379

    steps:
      # 1️⃣ Checkout your repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Python (ERPNext v15 compatible)
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3️⃣ Install system dependencies required by Bench
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            mariadb-client \
            redis-server \
            curl \
            build-essential \
            libffi-dev \
            libssl-dev

          # Install Node.js 18 (required by Frappe assets)
          curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
          sudo apt install -y nodejs

          # Install Yarn
          sudo npm install -g yarn

      # 4️⃣ Install Bench CLI
      - name: Install Frappe Bench
        run: |
          pip install frappe-bench

      # 5️⃣ Initialize a temporary bench for testing
      - name: Initialize test bench
        run: |
          bench init test-bench --frappe-branch version-15
          cd test-bench
          bench get-app erpnext --branch version-15

          # Copy the current repo (logi) into bench apps
          mv $GITHUB_WORKSPACE ./apps/logi

      # 6️⃣ Create site & install logi app (validates fixtures)
      - name: Create site and install app
        run: |
          cd test-bench
          bench new-site test.local \
            --admin-password admin \
            --mariadb-root-password admin

          bench --site test.local install-app logi

